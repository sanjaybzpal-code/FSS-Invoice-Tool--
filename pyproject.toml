[project]
name = "fss-invoice-tool"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
    "flask>=3.0",
    "reportlab>=4.0",
    "Pillow>=10.0",
    "pyodbc>=5.0; sys_platform == 'win32'",
    "pymssql>=2.3",
    "pdfplumber>=0.10",
    "psycopg2-binary>=2.9",
]

[tool.vercel]
entrypoint = "index:app"

[tool.vercel.scripts]
build = "python -c \"print('FSS Invoice Tool — Vercel build OK')\""
